manifestVersion: 1
id: solodeck-subnet-fw
name: Tailscale Subnet Fix
tagline: Keeps LAN miners reachable over Tailscale across reboots
icon: https://raw.githubusercontent.com/getumbrel/umbrel-apps/master/tailscale/icon.svg
category: networking
version: "1.1.0"
port: 8245
description: >-
  Re-applies the Docker FORWARD-DROP bypass rules (DOCKER-USER ACCEPT +
  MASQUERADE) and IP forwarding that a Dockerized Tailscale subnet router needs
  to route a phone on cellular into your home LAN (so SoloDeck / CK Solo Monitor
  can reach LAN miners away from home).


  Self-healing: re-asserts the rules every 30s and survives reboots, power-offs
  and app updates because umbrelOS manages the lifecycle. Auto-detects the LAN
  interface from the default route, so Wi-Fi and wired both work with no edits.


  Headless: no web UI; nothing to open.

developer: SoloDeck
website: https://solodeck.app
submitter: liviux1
submission: https://github.com/liviux1
repo: https://github.com/liviux1
support: https://github.com/liviux1
gallery:
  - https://raw.githubusercontent.com/getumbrel/umbrel-apps/master/tailscale/gallery/1.jpg
releaseNotes: >-
  Auto-detects the LAN interface from the default route each pass instead of
  using a hardcoded wlp1s0, so moving the box between Wi-Fi and wired no longer
  silently breaks routing.
dependencies:
  - tailscale
path: ""
defaultUsername: ""
defaultPassword: ""
